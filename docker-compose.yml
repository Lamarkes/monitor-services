
networks:
  test_net:
    driver: bridge

services:

  nginx:
    image: nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - test_net


  logservice:
    build: ./log-service
    networks: 
      - test_net
  
  statusservice:
    build: ./status-service
    networks:
      - test_net

  systeminfoservice:
    build: ./system-info-service
    networks:
      - test_net