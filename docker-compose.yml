
networks:
  test_net:
    driver: bridge

services:
  logservice:
    build: ./log-service
    ports:
      - "3003:3003"
    networks: 
      - test_net
  
  statusservice:
    build: ./status-service
    ports:
      - "3001:3001"
    networks:
      - test_net

  systeminfoservice:
    build: ./system-info-service
    ports:
      - "3002:3002"
    networks:
      - test_net