
networks:
  backend-net:
    driver: bridge
  database-net:
    driver: bridge

services:

  postgres:
    image: postgres:17.10-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database-net
      
  nginx:
    image: nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - backend-net
    depends_on:
      - statusservice1
      - statusservice2
      - statusservice3


  logservice:
    build: ./log-service
    networks: 
      - backend-net
      - database-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  statusservice1:
    build: ./status-service
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  
  statusservice2:
    build: ./status-service
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  
  statusservice3:
    build: ./status-service
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  systeminfoservice:
    build: ./system-info-service
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data: